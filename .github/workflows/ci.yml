name: PM Cosmetics Hub CI

on:
  push:
    branches:
      - main
      - api-gated-foundation
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Verify build evidence
        shell: bash
        run: |
          test -s dist/build-manifest.json
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("dist/build-manifest.json","utf8")); if (m.gate !== "CLOSED") throw new Error("Build gate is not CLOSED"); if (m.productsApi !== "503 DATA_INTAKE_LOCKED") throw new Error("Products API lock evidence is missing"); console.log("Build evidence verified:", JSON.stringify(m));'
      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmcosmetics-ci-evidence
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
